# Publishes the gem to RubyGems.org with trusted publishing (OIDC, no API key).
# Triggered by pushing a version tag, e.g.
#   git tag v0.2.1 && git push origin v0.2.1
# The rubygems.org trusted publisher for jsg must name this file (release.yml)
# and the "release" environment.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    environment: release

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: ruby
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the tag matches JSG::VERSION
        run: |
          version="$(ruby -Ilib -rjsg/version -e 'print JSG::VERSION')"
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "Tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - name: Run tests
        run: bundle exec rake
      - uses: rubygems/release-gem@v1
